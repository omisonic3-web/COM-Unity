<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Resetare parolă — COM-Unity</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;color:#f4f7ff;background:radial-gradient(ellipse at 15% 10%,#142c49,transparent 42%),radial-gradient(ellipse at 90% 35%,#241b48,transparent 40%),#080d18}
    main{width:min(100%,460px);padding:36px;border:1px solid #ffffff24;border-radius:25px;background:linear-gradient(145deg,#1b2a40f5,#101827f5);box-shadow:0 30px 100px #0009}
    .mark{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;color:#5ee3f5;background:#5ee3f51b;font-size:25px}
    .eyebrow{display:block;margin-top:22px;color:#69dff5;font-size:11px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase}
    h1{margin:12px 0 8px;font-size:29px}p{color:#9eacc2;font-size:14px;line-height:1.7}
    label{display:grid;gap:8px;margin-top:18px;color:#dce6f5;font-size:13px;font-weight:600}
    input{width:100%;min-height:48px;padding:0 14px;color:#f4f7ff;border:1px solid #ffffff24;border-radius:11px;background:#ffffff09;font:inherit}
    button{width:100%;min-height:49px;margin-top:22px;border:0;border-radius:12px;color:#06111c;background:linear-gradient(135deg,#62e3f6,#8d9cff);font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.message{min-height:20px;margin-top:14px;font-size:13px}.error{color:#ffb5b5}.success{color:#65e4b4}.back{display:block;margin-top:18px;text-align:center;color:#69dff5;text-decoration:none;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="mark">✦</div>
    <span class="eyebrow">COM-Unity • Securitatea contului</span>
    <h1>Alege o parolă nouă</h1>
    <p>Parola trebuie să aibă între 12 și 128 de caractere. Linkul poate fi folosit o singură dată și expiră în 30 de minute.</p>
    <form id="reset-form">
      <label for="password">Parolă nouă<input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <label for="confirm">Confirmă parola<input id="confirm" name="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <button id="submit" type="submit">Schimbă parola</button>
    </form>
    <div id="message" class="message" role="status"></div>
    <a class="back" href="/">Înapoi la COM-Unity</a>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");
    const submit = document.getElementById("submit");
    if (!/^[a-f0-9]{64}$/i.test(token)) { form.hidden = true; message.textContent = "Linkul de resetare este invalid sau incomplet. Solicită un link nou."; message.className = "message error"; }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      message.textContent = ""; message.className = "message";
      if (password !== confirm) { message.textContent = "Parolele nu coincid."; message.classList.add("error"); return; }
      submit.disabled = true; submit.textContent = "Se procesează...";
      try {
        const response = await fetch("/api/auth/reset-password", { method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token,password}) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Nu am putut schimba parola.");
        form.hidden = true; message.textContent = "Parola a fost schimbată. Te poți autentifica folosind noua parolă."; message.className = "message success";
      } catch (error) { message.textContent = error.message || "A apărut o eroare."; message.className = "message error"; }
      finally { submit.disabled = false; submit.textContent = "Schimbă parola"; }
    });
  </script>
</body>
</html>
